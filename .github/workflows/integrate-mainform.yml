name: Integrate MainForm

on:
  push:
    branches: [feature/professional-v2]
    paths:
      - .github/workflows/integrate-mainform.yml
      - .github/scripts/integrate-mainform.ps1

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/professional-v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Integrate and build
        shell: pwsh
        run: ./.github/scripts/integrate-mainform.ps1
