name: Build professional offline branch

on:
  push:
    branches:
      - feature/professional-v2-offline-local-print
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore CBL.PrintAssistant/CBL.PrintAssistant.csproj
      - run: dotnet build CBL.PrintAssistant/CBL.PrintAssistant.csproj -c Release --no-restore
      - name: Publish win-x64 test build
        run: dotnet publish CBL.PrintAssistant/CBL.PrintAssistant.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64
      - name: Add setup and test tools
        shell: pwsh
        run: |
          Copy-Item tools/Setup-LocalPrintHttps.ps1 publish/win-x64/Setup-LocalPrintHttps.ps1 -Force
          Copy-Item tools/Test-LocalPrint.ps1 publish/win-x64/Test-LocalPrint.ps1 -Force
          $runtimeFiles = @(
            "publish/win-x64/appconfig.json",
            "publish/win-x64/localprint.json",
            "publish/win-x64/localprint.pfx",
            "publish/win-x64/localprint.cer",
            "publish/win-x64/localprint.pfx.password",
            "publish/win-x64/localprint-data"
          )
          foreach ($runtimeFile in $runtimeFiles) {
            if (Test-Path $runtimeFile) { Remove-Item $runtimeFile -Recurse -Force }
          }
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBL.PrintAssistant-professional-v2-offline-test
          path: publish/win-x64
          if-no-files-found: error
          retention-days: 7
