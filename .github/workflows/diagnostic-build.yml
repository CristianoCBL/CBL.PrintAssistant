name: Diagnostic Build
on:
  push:
    branches: [feature/professional-v2]
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and capture log
        shell: pwsh
        run: |
          dotnet restore CBL.PrintAssistant/CBL.PrintAssistant.csproj
          dotnet build CBL.PrintAssistant/CBL.PrintAssistant.csproj -c Release --no-restore *> build.log
          $code = $LASTEXITCODE