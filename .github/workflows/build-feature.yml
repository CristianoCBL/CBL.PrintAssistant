name: Build feature branch

on:
  push:
    branches:
      - feature/offline-local-print
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CBL.PrintAssistant/CBL.PrintAssistant.csproj

      - name: Build
        run: dotnet build CBL.PrintAssistant/CBL.PrintAssistant.csproj -c Release --no-restore
