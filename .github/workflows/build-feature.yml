name: Build feature branch

on:
  push:
    branches:
      - feature/offline-local-print
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CBL.PrintAssistant/CBL.PrintAssistant.csproj

      - name: Build
        run: dotnet build CBL.PrintAssistant/CBL.PrintAssistant.csproj -c Release --no-restore

      - name: Publish win-x64 test build
        run: dotnet publish CBL.PrintAssistant/CBL.PrintAssistant.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish/win-x64

      - name: Remove local runtime data if present
        shell: pwsh
        run: |
          $paths = @(
            "publish/win-x64/appconfig.json",
            "publish/win-x64/localprint.json",
            "publish/win-x64/localprint.pfx",
            "publish/win-x64/localprint.pfx.password",
            "publish/win-x64/localprint-data"
          )
          foreach ($path in $paths) {
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }

      - name: Bundle local test tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "publish/win-x64/tools" | Out-Null
          Copy-Item "tools/Setup-LocalPrintHttps.ps1" "publish/win-x64/tools/Setup-LocalPrintHttps.ps1"
          Copy-Item "tools/Test-LocalPrint.ps1" "publish/win-x64/tools/Test-LocalPrint.ps1"

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBL.PrintAssistant-offline-local-print-test
          path: publish/win-x64
          if-no-files-found: error
          retention-days: 7
